name: Build extension packages

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JavaScript syntax
        run: |
          node --check content.js
          node --check service-worker.js
          node --check offscreen.js
          node --check popup.js

      - name: Check publisher shell syntax
        run: bash -n scripts/publish_chrome.sh

      - name: Build Chrome and Firefox packages
        run: python scripts/build.py

      - name: Validate Firefox package
        run: npx --yes web-ext lint --source-dir dist/firefox

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: capture-full-page-packages
          path: |
            dist/*.zip
          if-no-files-found: error
