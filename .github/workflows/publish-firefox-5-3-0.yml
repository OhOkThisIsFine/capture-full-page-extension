name: Publish Firefox 5.3.0 bootstrap

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-firefox-5-3-0.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      AMO_LICENSE: ${{ vars.AMO_LICENSE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify configured credentials
        shell: bash
        run: |
          test -n "$AMO_JWT_ISSUER" || { echo "Missing secret AMO_JWT_ISSUER" >&2; exit 2; }
          test -n "$AMO_JWT_SECRET" || { echo "Missing secret AMO_JWT_SECRET" >&2; exit 2; }
          test -n "$AMO_LICENSE" || { echo "Missing repository variable AMO_LICENSE" >&2; exit 2; }

      - name: Build Firefox package
        run: python scripts/build.py --target firefox

      - name: Validate Firefox package
        run: npx --yes web-ext@latest lint --source-dir dist/firefox

      - name: Create first-listing metadata
        shell: bash
        run: |
          jq -n \
            --arg license "$AMO_LICENSE" \
            '{
              summary: {
                "en-US": "Capture complete webpages as PNG files, including long pages and nested scrolling web apps."
              },
              categories: ["other"],
              version: {
                license: $license,
                approval_notes: "Capture Full Page is a local screenshot utility. It uses activeTab only after explicit user action, injects content.js to measure and scroll the page, and assembles the PNG locally in the extension background context. It makes no network requests, includes no analytics or remote code, and transmits no user data."
              }
            }' > "$RUNNER_TEMP/amo-metadata.json"

      - name: Submit version 5.3.0 to Firefox Add-ons
        run: |
          npx --yes web-ext@latest sign \
            --source-dir dist/firefox \
            --channel listed \
            --amo-metadata "$RUNNER_TEMP/amo-metadata.json" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 0 \
            --artifacts-dir dist/amo
