name: Publish privacy policy

on:
  push:
    branches:
      - master
    paths:
      - "docs/privacy.html"
      - ".github/workflows/publish-privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          STATUS="$(
            curl --silent --show-error               --output "$RUNNER_TEMP/pages.json"               --write-out "%{http_code}"               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/pages"
          )"

          if [[ "$STATUS" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages setup required::Enable Pages once under Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          else
            cat "$RUNNER_TEMP/pages.json" >&2
            echo "Unexpected GitHub Pages API status: $STATUS" >&2
            exit 1
          fi

      - name: Check out repository
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Prepare site
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp docs/privacy.html _site/index.html
          cp docs/privacy.html _site/privacy.html

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
