<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture fixture - app shell</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
  .app { height: 100vh; display: grid; grid-template: 64px 1fr / 190px 1fr; }
  header { grid-column: 1 / -1; padding: 20px; border-bottom: 2px solid; font-weight: 700; }
  aside { padding: 16px; border-right: 2px solid; }
  main { min-width: 0; min-height: 0; padding: 12px; }
  #scroller { width: 100%; height: 100%; overflow: auto; border: 2px solid; }
  .wide { min-width: 1450px; }
  .sticky { position: sticky; top: 0; z-index: 5; padding: 12px; background: Canvas; border-bottom: 2px dashed; }
  .row { height: 120px; padding: 14px; border-bottom: 1px solid; display: flex; align-items: center; gap: 24px; }
  iframe { width: 420px; height: 160px; border: 2px solid; }
  capture-shadow { display: block; margin: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>APP HEADER — must remain in the final capture</header>
  <aside>
    <strong>SIDEBAR</strong>
    <p>Shell content outside the nested scroller.</p>
  </aside>
  <main>
    <div id="scroller">
      <div class="wide">
        <div class="sticky">STICKY STRIP — should not repeat down the PNG</div>
        <div id="rows"></div>
        <div class="row">
          <strong>Same-origin srcdoc iframe:</strong>
          <iframe id="frame" srcdoc="<!doctype html><style>body{margin:0;font-family:sans-serif}.x{height:110px;padding:12px;border-bottom:1px solid}</style><div id='r'></div><script>for(let i=1;i<=12;i++){let d=document.createElement('div');d.className='x';d.textContent='IFRAME ROW '+i;document.querySelector('#r').appendChild(d)}</script>"></iframe>
        </div>
        <capture-shadow></capture-shadow>
      </div>
    </div>
  </main>
</div>
<script>
  const rows = document.getElementById('rows');
  for (let i = 1; i <= 36; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<strong>ROW ' + String(i).padStart(2, '0') + '</strong><span>horizontal marker A</span><span style="margin-left:auto">horizontal marker B</span>';
    rows.appendChild(row);
  }

  class CaptureShadow extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          .box { height: 180px; margin: 12px; padding: 20px; border: 3px dotted; }
          .moving { display:inline-block; animation: drift 0.6s linear infinite alternate; }
          @keyframes drift { from { transform: translateX(0); } to { transform: translateX(180px); } }
        </style>
        <div class="box"><strong>OPEN SHADOW ROOT</strong><p class="moving">animated marker</p></div>
      `;
    }
  }
  customElements.define('capture-shadow', CaptureShadow);
</script>
</body>
</html>
