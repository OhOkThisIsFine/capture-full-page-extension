<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture fixture - shrinking scroller</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
  .shell { height: 100vh; display: grid; grid-template-rows: 58px 1fr; }
  header { padding: 18px; border-bottom: 2px solid; font-weight: 700; }
  #scroller { overflow: auto; min-height: 0; }
  .row { height: 140px; padding: 20px; border-bottom: 1px solid; }
</style>
</head>
<body>
<div class="shell">
  <header>SHRINKING-SCROLLER FIXTURE</header>
  <div id="scroller"></div>
</div>
<script>
  const scroller = document.getElementById('scroller');
  for (let i = 1; i <= 45; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = 'ORIGINAL ROW ' + i;
    scroller.appendChild(row);
  }

  let shrunk = false;
  scroller.addEventListener('scroll', () => {
    if (shrunk || scroller.scrollTop < 250) return;
    shrunk = true;

    // Deliberately invalidate the frozen capture boundary. A robust capture
    // should abort rather than repeatedly requesting the same scroll position
    // or fabricate white output for the now-unreachable region.
    while (scroller.children.length > 10) {
      scroller.lastElementChild.remove();
    }
  }, { passive: true });
</script>
</body>
</html>
